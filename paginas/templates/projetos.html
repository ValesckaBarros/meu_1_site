{% extends "base.html" %}

{% block conteudo %}
    <h1>Meus Projetos</h1>
    <a href="/projetos/novo/">+ Novo projeto</a>


    <ul>
        {%for item in projetos%}
        <li class = "cartao">
            <strong>{{item.titulo}}</strong>:
            {{item.descricao}}, 
            <span class="tag">
                {{item.categoria}}
            </span>
        </li>
        {%endfor%}
    </ul>
{% endblock %}
